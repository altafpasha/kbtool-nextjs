version: '3'
services:
  nextjs-app:
    container_name: kbtool-njs
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '6903:3000'
    env_file:
      - .env.local
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      - ./maintenance-config.json:/app/maintenance-config.json
    restart: unless-stopped
